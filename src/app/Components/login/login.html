<div class="container soft-corners">
<h1 class="center " >LOG IN</h1> 
<input [(ngModel)]="username" placeholder="Username" class="mg-2"> <br>
<input [(ngModel)]="password" type="password" placeholder="Password" class="mg-2"> <br>
<button (click)="onLogin()" class="mg-2">Είσοδος</button>
<p class="mg-2">Δεν έχεις λογαριασμό; <a (click)="onCreateAccountClick()" >Δημιουργία λογαριασμού</a></p>
</div>
