<div class="main-div">
  <div class="calendar-wrapper">
  <mwl-calendar-month-view
    [viewDate]="viewDate"
    [events]="events"
    (dayClicked)="dayClicked($event.day)">
  </mwl-calendar-month-view>
</div>

<div class="misc-div green">
  <div class="w-100 h-20 red">
    <h3>Μικρογραφία ημερολόγιου</h3>
  </div>
  <div class="appointment-details w-100 h-20 yellow">
    <h3>Λεπτομέρειες</h3>
    @if (selectedDayEvents.length > 0) {
      @for (event of selectedDayEvents; track event.title) {
        <p>{{ event.title }}</p>
      }
    } @else {
      <p>Επίλεξε μια μέρα για να δεις τα ραντεβού.</p>
    }
  </div>

  <div class="w-100 h-60 blue">
    <h3>Εκκρεμότητες</h3>
  </div>
</div>
</div>
