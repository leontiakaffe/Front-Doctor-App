<div class="calendar-wrapper">
  <mwl-calendar-month-view
    [viewDate]="viewDate"
    [events]="events"
    (dayClicked)="dayClicked($event.day)">
  </mwl-calendar-month-view>
</div>

<div class="appointment-details">
  <h3>Λεπτομέρειες</h3>
  @if (selectedDayEvents.length > 0) {
    @for (event of selectedDayEvents; track event.title) {
      <p>{{ event.title }}</p>
    }
  } @else {
    <p>Επίλεξε μια μέρα για να δεις τα ραντεβού.</p>
  }
</div>
